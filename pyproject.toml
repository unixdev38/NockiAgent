[project]
name = "nocki-agent"
version = "0.1.0"
description = "Nocki Agent — a fully local, modular and secure AI agent (LangGraph + Ollama)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nocki Agent" }]

# Core dependencies for Phase 1 (Ollama + LangGraph + CLI).
# Later phases add optional dependency groups (see [project.optional-dependencies]).
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    # Cloud LLM via OpenRouter (OpenAI-compatible API)
    "langchain-openai>=1.0,<2.0",
    # Model Context Protocol client (official SDK, v1 API)
    "mcp>=1.2,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Phase 5 — HTTP API + streaming (+ chat web UI, uploads)
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",  # multipart uploads (POST /files)
    "pypdf>=4.0",               # PDF → text for uploaded documents
]
# Phase 6 — RAG / embeddings / vector store
rag = [
    "langchain-community>=0.3",
    "chromadb>=0.5",
]
# Development / tests
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # The API test suite (TestClient + SSE) needs the API stack too:
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.scripts]
nocki = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
